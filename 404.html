<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found — Stackly Motors</title>
  <meta name="description" content="The page you requested could not be found. Return to the Stackly Motors luxury automobile showroom.">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .notfound-section {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 1.5rem;
      overflow: hidden;
    }

    .notfound-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60vmax;
      height: 60vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(200, 164, 92, 0.10) 0%, transparent 60%);
      pointer-events: none;
    }

    .notfound-frame {
      position: absolute;
      inset: 2.5rem;
      border: 1px solid var(--charcoal-border);
      pointer-events: none;
    }

    .notfound-inner {
      position: relative;
      max-width: 640px;
    }

    .notfound-code {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      font-size: clamp(7rem, 22vw, 15rem);
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, var(--text-light) 20%, var(--gold) 75%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }

    .notfound-heading {
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      margin-top: 0.75rem;
    }

    .notfound-text {
      color: var(--text-light-muted);
      max-width: 46ch;
      margin: 1.25rem auto 2.25rem;
    }

    .notfound-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    @media (max-width: 640px) {
      .notfound-frame {
        inset: 1rem;
      }
    }
  </style>
</head>
<body>

  <main class="notfound-section" aria-labelledby="nfHeading">
    <div class="notfound-glow" aria-hidden="true"></div>
    <div class="notfound-frame" aria-hidden="true"></div>

    <div class="notfound-inner">
      <p class="section-tag">Error 404</p>
      <p class="notfound-code" aria-hidden="true">404</p>
      <h1 class="notfound-heading" id="nfHeading">This Road Leads <em>Nowhere</em></h1>
      <p class="notfound-text">
        The page you requested has drifted off the map. Stackly Motors is presented as a single showcase — please return to the showroom to continue your journey.
      </p>
      <div class="notfound-actions">
        <a href="index.html" class="btn btn-gold">Back to Showroom <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </main>

</body>
</html>
